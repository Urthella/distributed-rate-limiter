# OPTIONAL multi-instance stack — requires Docker (not needed for the local demo).
#
# Demonstrates DISTRIBUTED rate limiting: two gateway replicas behind an nginx
# load balancer share one Redis, so a client bouncing between replicas still
# gets exactly one limit (atomic Lua scripts). Prometheus scrapes both
# replicas; Grafana auto-provisions the bundled dashboard.
#
#   docker compose up --build
#
#   Gateway (via LB):  http://localhost:8080        (e.g. /api/fixed/demo)
#   Prometheus:        http://localhost:9090
#   Grafana:           http://localhost:3000        (admin / admin)
#
# Prove distribution: run the load generator against the LB —
#   GATEWAY_URL=http://localhost:8080 node scripts/loadgen.mjs
# The 429 counts match a single instance's limits even though two replicas serve traffic.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  upstream:
    build: .
    command: ["node", "dist/demo-upstream.js"]
    environment:
      - UPSTREAM_PORT=9100

  gateway1:
    build: .
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - CONFIG_PATH=/app/config/gateway.docker.json
    depends_on:
      redis:
        condition: service_healthy
      upstream:
        condition: service_started

  gateway2:
    build: .
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - CONFIG_PATH=/app/config/gateway.docker.json
    depends_on:
      redis:
        condition: service_healthy
      upstream:
        condition: service_started

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - gateway1
      - gateway2

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
